<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Covoiturage Club</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #17202a;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.header {
  background: linear-gradient(135deg, #1769e0, #4285f4);
  color: white;
  padding: 24px;
  border-radius: 20px;
  margin-bottom: 16px;
}

.header h1 {
  margin: 0 0 8px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

button {
  border: 0;
  border-radius: 11px;
  padding: 12px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #1769e0;
  color: white;
}

.secondary {
  background: #eaf1ff;
  color: #1769e0;
}

.danger {
  background: #ffe8e8;
  color: #c62828;
}

.full {
  width: 100%;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd2d8;
  border-radius: 10px;
  font-size: 16px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 13px;
  margin-bottom: 6px;
}

.event {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
}

.car {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
}

.child {
  background: #f3f5f7;
  padding: 10px;
  border-radius: 9px;
  margin-top: 8px;
}

.available {
  color: #16865b;
  font-weight: bold;
  margin-top: 10px;
}

.route {
  background: #f6f7f9;
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  background: white;
}

.tab.active {
  background: #1769e0;
  color: white;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 1000;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 20px;
  padding: 22px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.actions button {
  flex: 1;
}

.link {
  word-break: break-all;
  background: #f4f6f8;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
}

.hidden {
  display: none !important;
}

.small {
  font-size: 13px;
  color: #667;
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.top-actions button {
  flex: 1;
  min-width: 130px;
}

.edit-row {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.edit-row button {
  flex: 1;
  padding: 9px;
  font-size: 13px;
}

.car-title {
  font-size: 18px;
  margin-bottom: 5px;
}

.confirm-text {
  font-size: 17px;
  line-height: 1.5;
}

.warning {
  background: #fff5d9;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

</style>
</head>

<body>

<div class="container">

<!-- ==================================================
     ACCUEIL
================================================== -->

<div id="home">

  <div class="header">
    <h1>🚗 Covoiturage du club</h1>
    <div>Les trajets des entraînements</div>
  </div>

  <div class="card">

    <h2>📅 Événements</h2>

    <div id="events">
      Chargement...
    </div>

    <button
      class="primary full"
      onclick="openNewEvent()">

      ➕ Créer un événement

    </button>

</div>


<!-- ==================================================
     PAGE EVENEMENT
================================================== -->

<div id="eventPage" class="hidden">

  <button
    class="secondary"
    onclick="goHome()">

    ← Retour aux événements

  </button>

  <div class="header">

    <h1 id="eventName"></h1>

    <div id="eventDate"></div>

    <div id="eventTime"></div>

    <div class="top-actions">

      <button
        class="secondary"
        onclick="openEditEvent()">

        ✏️ Modifier

      </button>

      <button
        class="danger"

        🗑️ Supprimer

      </button>

  </div>


  <div class="card">

    <h3>🚗 Aller</h3>

    <div id="allerRoute"></div>

    <h3>🔄 Retour</h3>

    <div id="retourRoute"></div>

  </div>


  <div class="tabs">

    <button
      id="allerTab"
      class="tab active"
      onclick="changeDirection('aller')">

      🚗 Aller

    </button>

    <button
      id="retourTab"
      class="tab"
      onclick="changeDirection('retour')">

      🔄 Retour

    </button>

  </div>


  <!-- ALLER -->

  <div id="allerSection">

    <div class="card">

      <h2>🚗 Voitures pour l'aller</h2>

      <div id="allerCars"></div>

      <button
        class="primary full"
        onclick="openNewCar('aller')">

        🚗 Je propose une voiture

      </button>

    </div>

  </div>


  <!-- RETOUR -->

  <div id="retourSection" class="hidden">

    <div class="card">

      <h2>🔄 Voitures pour le retour</h2>

      <div id="retourCars"></div>

      <button
        class="primary full"
        onclick="openNewCar('retour')">

        🚗 Je propose une voiture

      </button>

    </div>

  </div>


  <div class="card">

    <h3>🔗 Lien de cet événement</h3>

    <div
      id="eventLink"
      class="link">
    </div>

    <button
      class="secondary full"
      onclick="copyEventLink()">

      📋 Copier le lien

    </button>

  </div>

</div>

</div>


<!-- ==================================================
     MODALE
================================================== -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

  </div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://dyiwqnnhujxndkqdjznn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nk1KPJ3rtiDSh0yyEl2ynA_6RUpfqqB";


/* ==================================================
   VARIABLES
================================================== */

let currentEvent = null;
let currentDirection = "aller";


/* ==================================================
   API SUPABASE
================================================== */

async function apiRequest(endpoint, options = {}) {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + endpoint,
    {
      method: options.method || "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": options.prefer || "return=representation"
      },

      body: options.body
        ? JSON.stringify(options.body)
        : undefined
    }
  );

  if (!response.ok) {

    const message = await response.text();

    throw new Error(
      message || "Erreur Supabase"
    );
  }

  const text = await response.text();

  return text ? JSON.parse(text) : [];
}


/* ==================================================
   CODE EVENEMENT
================================================== */

function makeCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 6; i++) {

    code += chars[
      Math.floor(
        Math.random() * chars.length
      )
    ];

  }

  return code;
}


/* ==================================================
   CHARGER EVENEMENTS
================================================== */

async function loadEvents() {

  const box =
    document.getElementById("events");

  box.innerHTML = "Chargement...";

  try {

    const events =
      await apiRequest(
        "events?select=*&order=date.asc"
      );

    if (events.length === 0) {

      box.innerHTML =
        "<p>Aucun événement pour le moment.</p>";

      return;
    }

    box.innerHTML = "";

    events.forEach(event => {

      const item =
        document.createElement("div");

      item.className = "event";

      item.innerHTML = `

        <h3>
          🏐 ${safe(event.name)}
        </h3>

        <p>
          📅 ${formatDate(event.date)}
          ${
            event.time
              ? " à " + safe(event.time)
              : ""
          }
        </p>

        <p>
          🚗
          ${safe(event.aller_depart)}
          →
          ${safe(event.aller_arrivee)}
        </p>

        <button
          class="primary"
          onclick="openEventPage('${event.code}')">

          Ouvrir

        </button>

      `;

      box.appendChild(item);

    });

  } catch(error) {

    console.error(error);

    box.innerHTML = `
      <p>❌ Impossible de charger les événements.</p>
      <p class="small">${safe(error.message)}</p>
    `;
  }
}


/* ==================================================
   CREER EVENEMENT
================================================== */

function openNewEvent() {

  showModal(

    "➕ Créer un événement",

    `

    <label>Nom de l'événement</label>

    <input
      id="eventNameInput"
      value="Entraînement">


    <label>Date</label>

    <input
      id="eventDateInput"
      type="date">


    <label>Heure</label>

    <input
      id="eventTimeInput"
      type="time">


    <div class="route">

      <h3>🚗 Aller</h3>

      <label>Départ</label>

      <input
        id="allerDeparture"
        value="St-Georges-sur-Loire">

      <label>Arrivée</label>

      <input
        id="allerArrival"
        value="La Possonnière">

    </div>


    <div class="route">

      <h3>🔄 Retour</h3>

      <label>Départ</label>

      <input
        id="returnDeparture"
        value="La Possonnière">

      <label>Arrivée</label>

      <input
        id="returnArrival"
        value="St-Georges-sur-Loire">

    </div>


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="saveNewEvent()">

        Créer

      </button>

    </div>

    `
  );
}


async function saveNewEvent() {

  const name =
    document.getElementById(
      "eventNameInput"
    ).value.trim();

  const date =
    document.getElementById(
      "eventDateInput"
    ).value;

  const time =
    document.getElementById(
      "eventTimeInput"
    ).value;

  const allerDeparture =
    document.getElementById(
      "allerDeparture"
    ).value.trim();

  const allerArrival =
    document.getElementById(
      "allerArrival"
    ).value.trim();

  const returnDeparture =
    document.getElementById(
      "returnDeparture"
    ).value.trim();

  const returnArrival =
    document.getElementById(
      "returnArrival"
    ).value.trim();


  if (
    !name ||
    !date ||
    !allerDeparture ||
    !allerArrival ||
    !returnDeparture ||
    !returnArrival
  ) {

    alert(
      "Merci de remplir tous les champs obligatoires."
    );

    return;
  }


  try {

    const result =
      await apiRequest(
        "events",
        {
          method: "POST",

          body: {

            code: makeCode(),

            name: name,

            date: date,

            time: time,

            aller_depart:
              allerDeparture,

            aller_arrivee:
              allerArrival,

            retour_depart:
              returnDeparture,

            retour_arrivee:
              returnArrival
          }
        }
      );


    if (!result.length) {

      throw new Error(
        "L'événement n'a pas été créé."
      );
    }


    closeModal();

    await openEventPage(
      result[0].code
    );


  } catch(error) {

    console.error(error);

    alert(
      "❌ Erreur lors de la création :\n\n" +
      error.message
    );
  }
}


/* ==================================================
   MODIFIER EVENEMENT
================================================== */

function openEditEvent() {

  showModal(

    "✏️ Modifier l'événement",

    `

    <label>Nom de l'événement</label>

    <input
      id="editEventName"
      value="${safe(currentEvent.name)}">


    <label>Date</label>

    <input
      id="editEventDate"
      type="date"
      value="${safe(currentEvent.date)}">


    <label>Heure</label>

    <input
      id="editEventTime"
      type="time"
      value="${safe(currentEvent.time || "")}">


    <div class="route">

      <h3>🚗 Aller</h3>

      <label>Départ</label>

      <input
        id="editAllerDeparture"
        value="${safe(currentEvent.aller_depart)}">

      <label>Arrivée</label>

      <input
        id="editAllerArrival"
        value="${safe(currentEvent.aller_arrivee)}">

    </div>


    <div class="route">

      <h3>🔄 Retour</h3>

      <label>Départ</label>

      <input
        id="editReturnDeparture"
        value="${safe(currentEvent.retour_depart)}">

      <label>Arrivée</label>

      <input
        id="editReturnArrival"
        value="${safe(currentEvent.retour_arrivee)}">

    </div>


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="confirmEditEvent()">

        Enregistrer

      </button>

    </div>

    `
  );
}


/* ==================================================
   CONFIRMATION MODIFICATION EVENEMENT
================================================== */

function confirmEditEvent() {

  const ok =
    confirm(
      "Voulez-vous enregistrer les modifications de cet événement ?"
    );

  if (!ok) return;

  saveEditEvent();
}


async function saveEditEvent() {

  const data = {

    name:
      document.getElementById(
        "editEventName"
      ).value.trim(),

    date:
      document.getElementById(
        "editEventDate"
      ).value,

    time:
      document.getElementById(
        "editEventTime"
      ).value,

    aller_depart:
      document.getElementById(
        "editAllerDeparture"
      ).value.trim(),

    aller_arrivee:
      document.getElementById(
        "editAllerArrival"
      ).value.trim(),

    retour_depart:
      document.getElementById(
        "editReturnDeparture"
      ).value.trim(),

    retour_arrivee:
      document.getElementById(
        "editReturnArrival"
      ).value.trim()
  };


  if (
    !data.name ||
    !data.date ||
    !data.aller_depart ||
    !data.aller_arrivee ||
    !data.retour_depart ||
    !data.retour_arrivee
  ) {

    alert(
      "Merci de remplir tous les champs."
    );

    return;
  }


  try {

    await apiRequest(
      "events?id=eq." +
      encodeURIComponent(
        currentEvent.id
      ),
      {
        method: "PATCH",
        body: data
      }
    );


    closeModal();


    const updated =
      await apiRequest(
        "events?id=eq." +
        encodeURIComponent(
          currentEvent.id
        ) +
        "&select=*"
      );


    currentEvent =
      updated[0];


    renderEvent();

    await loadEvents();

    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible de modifier l'événement :\n\n" +
      error.message
    );
  }
}


/* ==================================================
   OUVRIR EVENEMENT
================================================== */

async function openEventPage(code) {

  try {

    const events =
      await apiRequest(
        "events?code=eq." +
        encodeURIComponent(code) +
        "&select=*"
      );


    if (!events.length) {

      alert(
        "Événement introuvable."
      );

      return;
    }


    currentEvent =
      events[0];


    history.pushState(
      {},
      "",
      window.location.pathname +
      "?event=" +
      encodeURIComponent(
        currentEvent.code
      )
    );


    document
      .getElementById("home")
      .classList.add("hidden");


    document
      .getElementById("eventPage")
      .classList.remove("hidden");


    renderEvent();

    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible d'ouvrir l'événement :\n\n" +
      error.message
    );
  }
}


/* ==================================================
   AFFICHER EVENEMENT
================================================== */

function renderEvent() {

  document.getElementById(
    "eventName"
  ).textContent =
    "🏐 " + currentEvent.name;


  document.getElementById(
    "eventDate"
  ).textContent =
    "📅 " +
    formatDate(
      currentEvent.date
    );


  document.getElementById(
    "eventTime"
  ).textContent =
    currentEvent.time
      ? "🕐 " + currentEvent.time
      : "";


  document.getElementById(
    "allerRoute"
  ).textContent =
    currentEvent.aller_depart +
    " → " +
    currentEvent.aller_arrivee;


  document.getElementById(
    "retourRoute"
  ).textContent =
    currentEvent.retour_depart +
    " → " +
    currentEvent.retour_arrivee;


  document.getElementById(
    "eventLink"
  ).textContent =
    window.location.href;
}


/* ==================================================
   CHARGER VOITURES
================================================== */

async function loadCars() {

  const cars =
    await apiRequest(
      "cars?event_id=eq." +
      encodeURIComponent(
        currentEvent.id
      ) +
      "&select=*&order=created_at.asc"
    );


  const children =
    await apiRequest(
      "children?select=*"
    );


  cars.forEach(car => {

    car.children =
      children.filter(
        child =>
          child.car_id === car.id
      );

  });


  renderCars(
    "aller",
    cars
  );

  renderCars(
    "retour",
    cars
  );
}


/* ==================================================
   AFFICHER VOITURES
================================================== */

function renderCars(
  direction,
  cars
) {

  const box =
    document.getElementById(
      direction + "Cars"
    );


  box.innerHTML = "";


  const filtered =
    cars.filter(
      car =>
        car.direction === direction
    );


  if (!filtered.length) {

    box.innerHTML =
      "<p>Aucune voiture pour le moment.</p>";

    return;
  }


  filtered.forEach(car => {

    const children =
      car.children || [];


    const available =
      car.places -
      children.length;


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "car";


    let html = `

      <div class="car-title">
        🚗 <strong>${safe(car.driver_name)}</strong>
      </div>

      <div>
        ${car.places} place(s)
      </div>

    `;


    children.forEach(child => {

      html += `

        <div class="child">

          👦 ${safe(child.name)}

          <div class="edit-row">

            <button
              class="secondary"
              onclick="openEditChild(
                '${child.id}'
              )">

              ✏️ Modifier

            </button>

            <button
              class="danger"
              onclick="askDeleteChild1(
                '${child.id}'
              )">

              🗑️ Supprimer

            </button>

          </div>

        </div>

      `;

    });


    if (available > 0) {

      html += `

        <div class="available">

          🟢
          ${available}
          place(s) disponible(s)

        </div>

        <button
          class="secondary full"
          onclick="openNewChild(
            '${car.id}'
          )">

          + Ajouter un enfant

        </button>

      `;

    } else {

      html += `

        <div
          style="
            margin-top:10px;
            color:#c62828;
            font-weight:bold">

          🔴 Voiture complète

        </div>

      `;

    }


    html += `

      <div class="edit-row">

        <button
          class="secondary"
          onclick="openEditCar(
            '${car.id}'
          )">

          ✏️ Modifier la voiture

        </button>

        <button
          class="danger"
          onclick="askDeleteCar1(
            '${car.id}'
          )">

          🗑️ Supprimer

        </button>

      </div>

    `;


    item.innerHTML =
      html;


    box.appendChild(item);

  });
}


/* ==================================================
   NOUVELLE VOITURE
================================================== */

function openNewCar(direction) {

  currentDirection =
    direction;


  showModal(

    direction === "aller"
      ? "🚗 Voiture pour l'aller"
      : "🔄 Voiture pour le retour",

    `

    <label>
      Nom et prénom du conducteur
    </label>

    <input
      id="driverInput"
      placeholder="Ex. Jean Dupont">


    <label>
      Nombre de places disponibles
    </label>

    <input
      id="placesInput"
      type="number"
      min="1"
      max="8"
      value="2">


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="saveNewCar()">

        Ajouter

      </button>

    </div>

    `
  );
}


/* ==================================================
   ENREGISTRER VOITURE
================================================== */

async function saveNewCar() {

  const driver =
    document.getElementById(
      "driverInput"
    ).value.trim();


  const places =
    Number(
      document.getElementById(
        "placesInput"
      ).value
    );


  if (!driver) {

    alert(
      "Merci d'indiquer votre nom."
    );

    return;
  }


  if (
    places < 1 ||
    places > 8
  ) {

    alert(
      "Le nombre de places doit être compris entre 1 et 8."
    );

    return;
  }


  try {

    await apiRequest(
      "cars",
      {
        method: "POST",

        body: {

          event_id:
            currentEvent.id,

          direction:
            currentDirection,

          driver_name:
            driver,

          places:
            places
        }
      }
    );


    closeModal();

    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible d'ajouter la voiture :\n\n" +
      error.message
    );
  }
}


/* ==================================================
   MODIFIER VOITURE
================================================== */

async function openEditCar(carId) {

  try {

    const cars =
      await apiRequest(
        "cars?id=eq." +
        encodeURIComponent(carId) +
        "&select=*"
      );

      `

      <label>

      <input
        id="editCarDriver"

    );
  }
}


async function saveEditCar(carId) {

  const driver =
    document.getElementById(
      "editCarDriver"

  const places =
    Number(
      document.getElementById(
        "editCarPlaces"
      ).value
    );


  if (!driver || places < 1) {

    alert(
      "Merci de renseigner correctement les informations."
    );

    return;
  }


  const ok =
    confirm(
      "Voulez-vous enregistrer les modifications de cette voiture ?"
    );


  if (!ok) return;


  try {

    await apiRequest(
      "cars?id=eq." +
      encodeURIComponent(carId),

        method: "PATCH",

        body: {

          driver_name:
            driver,

          places:
            places
        }

    );


    closeModal();

    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible de modifier la voiture :\n\n" +

  }
}

/* ==================================================
   SUPPRIMER EVENEMENT
================================================== */

async function deleteEvent() {

  try {

    /*
      On récupère les voitures
      de l'événement.
    */

    const cars =
      await apiRequest(
        "cars?event_id=eq." +
        encodeURIComponent(
          currentEvent.id
        ) +
        "&select=id"
      );


    /*
      Suppression des enfants
      de chaque voiture.
    */

    for (
      const car of cars
    ) {

      await apiRequest(
        "children?car_id=eq." +
        encodeURIComponent(car.id),
        {
          method: "DELETE",
          prefer: "return=minimal"
        }
      );

    }


    /*
      Suppression des voitures.
    */

    await apiRequest(
      "cars?event_id=eq." +
      encodeURIComponent(
        currentEvent.id
      ),
      {
        method: "DELETE",
        prefer: "return=minimal"
      }
    );


    /*
      Suppression de l'événement.
    */

    await apiRequest(
      "events?id=eq." +
      encodeURIComponent(
        currentEvent.id
      ),
      {
        method: "DELETE",
        prefer: "return=minimal"
      }
    );


    currentEvent = null;


    history.pushState(
      {},
      "",
      window.location.pathname
    );


    document
      .getElementById("eventPage")
      .classList.add("hidden");


    document
      .getElementById("home")
      .classList.remove("hidden");


    await loadEvents();


    alert(
      "✅ L'événement a été supprimé."
    );


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible de supprimer l'événement :\n\n" +
      error.message
    );
  }
}

function changeDirection(
  direction
) {

  currentDirection =
    direction;


  const isAller =
    direction === "aller";


  document
    .getElementById(
      "allerSection"
    )
    .classList.toggle(
      "hidden",
      !isAller
    );


  document
    .getElementById(
      "retourSection"
    )
    .classList.toggle(
      "hidden",
      isAller
    );


  document
    .getElementById(
      "allerTab"
    )
    .classList.toggle(
      "active",
      isAller
    );


  document
    .getElementById(
      "retourTab"
    )
    .classList.toggle(
      "active",
      !isAller
    );
}

/* ==================================================
   UTILITAIRES
================================================== */

function formatDate(date) {

  if (!date)
    return "";

  const parts =
    date.split("-");

  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );
}


function safe(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get("event");

    await openEventPage(

    );

  } else {

  }
}
