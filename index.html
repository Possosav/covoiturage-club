<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Covoiturage Club</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  color: #17202a;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.header {
  background: linear-gradient(135deg, #1769e0, #4285f4);
  color: white;
  padding: 24px;
  border-radius: 20px;
  margin-bottom: 16px;
}

.header h1 {
  margin: 0 0 8px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

button {
  border: 0;
  border-radius: 11px;
  padding: 12px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #1769e0;
  color: white;
}

.secondary {
  background: #eaf1ff;
  color: #1769e0;
}

.full {
  width: 100%;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd2d8;
  border-radius: 10px;
  font-size: 16px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 13px;
  margin-bottom: 6px;
}

.event {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
}

.car {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
}

.child {
  background: #f3f5f7;
  padding: 9px;
  border-radius: 9px;
  margin-top: 7px;
}

.available {
  color: #16865b;
  font-weight: bold;
  margin-top: 10px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 20px;
  padding: 22px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.actions button {
  flex: 1;
}

.route {
  background: #f6f7f9;
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  background: white;
}

.tab.active {
  background: #1769e0;
  color: white;
}

.hidden {
  display: none;
}

.link {
  word-break: break-all;
  background: #f4f6f8;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<!-- ACCUEIL -->

<div id="home">

  <div class="header">
    <h1>🚗 Covoiturage du club</h1>
    <div>Les trajets des entraînements</div>
  </div>

  <div class="card">

    <h2>📅 Événements</h2>

    <div id="events"></div>

    <button
      class="primary full"
      onclick="openCreateEvent()">

      ➕ Créer un événement

    </button>

  </div>

</div>


<!-- EVENEMENT -->

<div id="eventPage" class="hidden">

  <button
    class="secondary"
    onclick="goHome()">

    ← Retour

  </button>

  <div class="header">

    <h1 id="eventName"></h1>

    <div id="eventDate"></div>

    <div id="eventTime"></div>

  </div>


  <div class="card">

    <h3>🚗 Aller</h3>

    <div id="allerRoute"></div>

    <h3>🔄 Retour</h3>

    <div id="retourRoute"></div>

  </div>


  <div class="tabs">

    <button
      id="allerTab"
      class="tab active"
      onclick="showDirection('aller')">

      🚗 Aller

    </button>

    <button
      id="retourTab"
      class="tab"
      onclick="showDirection('retour')">

      🔄 Retour

    </button>

  </div>


  <div id="aller">

    <div class="card">

      <h2>🚗 Voitures</h2>

      <div id="allerCars"></div>

      <button
        class="primary full"
        onclick="openCar('aller')">

        🚗 Je propose une voiture

      </button>

    </div>

  </div>


  <div id="retour" class="hidden">

    <div class="card">

      <h2>🚗 Voitures</h2>

      <div id="retourCars"></div>

      <button
        class="primary full"
        onclick="openCar('retour')">

        🚗 Je propose une voiture

      </button>

    </div>

  </div>


  <div class="card">

    <h3>🔗 Partager</h3>

    <div
      id="eventLink"
      class="link">
    </div>

    <button
      class="secondary full"
      onclick="copyLink()">

      📋 Copier le lien

    </button>

  </div>

</div>

</div>


<!-- MODALE -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dyiwqnnhujxndkqdjznn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nk1KPJ3rtiDSh0yyEl2ynA_6RUpfqqB";


/* =====================================================
   VARIABLES
===================================================== */

let currentEvent = null;

let currentDirection = "aller";


/* =====================================================
   REQUETE SUPABASE
===================================================== */

async function supabaseRequest(
  table,
  options = {}
) {

  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    table;


  const response =
    await fetch(url, {

      method:
        options.method || "GET",

      headers: {

        "apikey":
          SUPABASE_KEY,

        "Authorization":
          "Bearer " +
          SUPABASE_KEY,

        "Content-Type":
          "application/json",

        "Prefer":
          options.prefer ||
          "return=representation"

      },

      body:
        options.body
          ? JSON.stringify(
              options.body
            )
          : undefined

    });


  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      text ||
      "Erreur Supabase"
    );

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : [];

}


/* =====================================================
   CODE EVENEMENT
===================================================== */

function generateCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return code;

}


/* =====================================================
   AFFICHER LES EVENEMENTS
===================================================== */

async function loadEvents() {

  const container =
    document.getElementById(
      "events"
    );


  container.innerHTML =
    "Chargement...";


  try {

    const data =
      await supabaseRequest(
        "events?select=*&order=date.asc"
      );


    container.innerHTML = "";


    if (
      data.length === 0
    ) {

      container.innerHTML =
        "<p>Aucun événement.</p>";

      return;

    }


    data.forEach(
      event => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "event";


        div.innerHTML = `

          <h3>
            🏐 ${escapeHtml(event.name)}
          </h3>

          <p>
            📅 ${formatDate(event.date)}
            ${
              event.time
                ? " à " +
                  event.time
                : ""
            }
          </p>

          <p>
            🚗
            ${escapeHtml(event.aller_depart)}
            →
            ${escapeHtml(event.aller_arrivee)}
          </p>

          <button
            class="primary"
            onclick="
              openEvent('${event.code}')
            ">

            Ouvrir

          </button>

        `;


        container.appendChild(
          div
        );

      }
    );


  } catch(error) {

    container.innerHTML =
      "❌ Impossible de charger les événements.";

    console.error(error);

  }

}


/* =====================================================
   CREER EVENEMENT
===================================================== */

function openCreateEvent() {

  showModal(

    "➕ Créer un événement",

    `

    <label>
      Nom
    </label>

    <input
      id="newName"
      value="Entraînement">


    <label>
      Date
    </label>

    <input
      id="newDate"
      type="date">


    <label>
      Heure
    </label>

    <input
      id="newTime"
      type="time">


    <div class="route">

      <h3>🚗 Aller</h3>

      <label>
        Départ
      </label>

      <input
        id="allerDepart"
        value="St-Georges-sur-Loire">


      <label>
        Arrivée
      </label>

      <input
        id="allerArrivee"
        value="La Possonnière">

    </div>


    <div class="route">

      <h3>🔄 Retour</h3>

      <label>
        Départ
      </label>

      <input
        id="retourDepart"
        value="La Possonnière">


      <label>
        Arrivée
      </label>

      <input
        id="retourArrivee"
        value="St-Georges-sur-Loire">

    </div>


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="createEvent()">

        Créer

      </button>

    </div>

    `

  );

}


async function createEvent() {

  const name =
    document
      .getElementById(
        "newName"
      )
      .value
      .trim();


  const date =
    document
      .getElementById(
        "newDate"
      )
      .value;


  const time =
    document
      .getElementById(
        "newTime"
      )
      .value;


  if (!name || !date) {

    alert(
      "Merci de renseigner le nom et la date."
    );

    return;

  }


  const code =
    generateCode();


  try {

    const result =
      await supabaseRequest(
        "events",
        {

          method:
            "POST",

          body: {

            code:
              code,

            name:
              name,

            date:
              date,

            time:
              time,

            aller_depart:
              document
                .getElementById(
                  "allerDepart"
                )
                .value
                .trim(),

            aller_arrivee:
              document
                .getElementById(
                  "allerArrivee"
                )
                .value
                .trim(),

            retour_depart:
              document
                .getElementById(
                  "retourDepart"
                )
                .value
                .trim(),

            retour_arrivee:
              document
                .getElementById(
                  "retourArrivee"
                )
                .value
                .trim()

          }

        }

      );


    if (
      !result.length
    ) {

      throw new Error(
        "L'événement n'a pas été créé."
      );

    }


    closeModal();


    openEvent(code);


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible de créer l'événement.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   OUVRIR EVENEMENT
===================================================== */

async function openEvent(code) {

  try {

    const data =
      await supabaseRequest(
        "events?code=eq." +
        encodeURIComponent(code) +
        "&select=*"
      );


    if (
      !data.length
    ) {

      alert(
        "Événement introuvable."
      );

      return;

    }


    currentEvent =
      data[0];


    history.pushState(
      {},
      "",
      "?event=" +
      code
    );


    document
      .getElementById(
        "home"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "eventPage"
      )
      .classList.remove(
        "hidden"
      );


    renderEvent();


    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "Erreur : " +
      error.message
    );

  }

}


/* =====================================================
   AFFICHER EVENEMENT
===================================================== */

function renderEvent() {

  document
    .getElementById(
      "eventName"
    )
    .textContent =
      "🏐 " +
      currentEvent.name;


  document
    .getElementById(
      "eventDate"
    )
    .textContent =
      "📅 " +
      formatDate(
        currentEvent.date
      );


  document
    .getElementById(
      "eventTime"
    )
    .textContent =
      currentEvent.time
        ? "🕐 " +
          currentEvent.time
        : "";


  document
    .getElementById(
      "allerRoute"
    )
    .textContent =
      currentEvent.aller_depart +
      " → " +
      currentEvent.aller_arrivee;


  document
    .getElementById(
      "retourRoute"
    )
    .textContent =
      currentEvent.retour_depart +
      " → " +
      currentEvent.retour_arrivee;


  document
    .getElementById(
      "eventLink"
    )
    .textContent =
      window.location.href;

}


/* =====================================================
   VOITURES
===================================================== */

async function loadCars() {

  const data =
    await supabaseRequest(
      "cars?event_id=eq." +
      currentEvent.id +
      "&select=*,children(*)&order=created_at.asc"
    );


  renderCars(
    "aller",
    data
  );


  renderCars(
    "retour",
    data
  );

}


function renderCars(
  direction,
  cars
) {

  const container =
    document.getElementById(
      direction +
      "Cars"
    );


  container.innerHTML = "";


  const filtered =
    cars.filter(
      car =>
        car.direction ===
        direction
    );


  if (
    filtered.length === 0
  ) {

    container.innerHTML =
      "<p>Aucune voiture pour le moment.</p>";

    return;

  }


  filtered.forEach(
    car => {

      const children =
        car.children || [];


      const remaining =
        car.places -
        children.length;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "car";


      let html = `

        <strong>
          🚗 ${escapeHtml(car.driver_name)}
        </strong>

        <div>
          ${car.places}
          place(s)
        </div>

      `;


      children.forEach(
        child => {

          html += `

            <div class="child">

              👦
              ${escapeHtml(child.name)}

            </div>

          `;

        }
      );


      if (
        remaining > 0
      ) {

        html += `

          <div class="available">

            🟢
            ${remaining}
            place(s) disponible(s)

          </div>

          <button
            class="secondary full"
            onclick="
              addChild(
                '${car.id}'
              )
            ">

            + Ajouter un enfant

          </button>

        `;

      } else {

        html += `

          <div style="
            color:#c62828;
            font-weight:bold;
            margin-top:10px">

            🔴 Voiture complète

          </div>

        `;

      }


      div.innerHTML =
        html;


      container.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   AJOUTER VOITURE
===================================================== */

function openCar(
  direction
) {

  currentDirection =
    direction;


  showModal(

    "🚗 Proposer une voiture",

    `

    <label>
      Votre nom et prénom
    </label>

    <input
      id="driverName"
      placeholder="Ex. Jean Dupont">


    <label>
      Nombre de places
    </label>

    <input
      id="places"
      type="number"
      min="1"
      max="8"
      value="2">


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="createCar()">

        Ajouter

      </button>

    </div>

    `

  );

}


async function createCar() {

  const name =
    document
      .getElementById(
        "driverName"
      )
      .value
      .trim();


  const places =
    Number(
      document
        .getElementById(
          "places"
        )
        .value
    );


  if (!name) {

    alert(
      "Merci d'indiquer votre nom."
    );

    return;

  }


  if (
    places < 1 ||
    places > 8
  ) {

    alert(
      "Nombre de places incorrect."
    );

    return;

  }


  /*
   * Code propriétaire temporaire.
   * La version suivante l'utilisera
   * pour protéger la voiture.
   */

  const ownerCode =
    Math.floor(
      1000 +
      Math.random() *
      9000
    ).toString();


  try {

    await supabaseRequest(
      "cars",
      {

        method:
          "POST",

        body: {

          event_id:
            currentEvent.id,

          direction:
            currentDirection,

          driver_name:
            name,

          places:
            places,

          owner_code:
            ownerCode

        }

      }
    );


    closeModal();


    alert(
      "✅ Votre voiture est créée.\n\n" +
      "Votre code propriétaire : " +
      ownerCode +
      "\n\n" +
      "Gardez ce code pour pouvoir gérer votre voiture."
    );


    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible d'ajouter la voiture.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   AJOUTER ENFANT
===================================================== */

function addChild(
  carId
) {

  showModal(

    "👦 Ajouter un enfant",

    `

    <label>
      Prénom et nom
    </label>

    <input
      id="childName"
      placeholder="Ex. Lucas Martin">


    <div class="actions">

      <button
        class="secondary"
        onclick="closeModal()">

        Annuler

      </button>

      <button
        class="primary"
        onclick="
          createChild(
            '${carId}'
          )
        ">

        Ajouter

      </button>

    </div>

    `

  );

}


async function createChild(
  carId
) {

  const name =
    document
      .getElementById(
        "childName"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "Merci d'indiquer le nom."
    );

    return;

  }


  try {

    await supabaseRequest(
      "children",
      {

        method:
          "POST",

        body: {

          car_id:
            carId,

          name:
            name

        }

      }
    );


    closeModal();

    await loadCars();


  } catch(error) {

    console.error(error);

    alert(
      "❌ Impossible d'ajouter l'enfant.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   DIRECTION
===================================================== */

function showDirection(
  direction
) {

  currentDirection =
    direction;


  document
    .getElementById(
      "aller"
    )
    .classList.toggle(
      "hidden",
      direction !== "aller"
    );


  document
    .getElementById(
      "retour"
    )
    .classList.toggle(
      "hidden",
      direction !== "retour"
    );


  document
    .getElementById(
      "allerTab"
    )
    .classList.toggle(
      "active",
      direction === "aller"
    );


  document
    .getElementById(
      "retourTab"
    )
    .classList.toggle(
      "active",
      direction === "retour"
    );

}


/* =====================================================
   MODALE
===================================================== */

function showModal(
  title,
  body
) {

  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      title;


  document
    .getElementById(
      "modalBody"
    )
    .innerHTML =
      body;


  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "open"
    );

}


function closeModal() {

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "open"
    );

}


/* =====================================================
   COPIER LIEN
===================================================== */

function copyLink() {

  navigator.clipboard
    .writeText(
      window.location.href
    )
    .then(
      () => {

        alert(
          "✅ Lien copié !"
        );

      }
    );

}


/* =====================================================
   RETOUR ACCUEIL
===================================================== */

function goHome() {

  history.pushState(
    {},
    "",
    window.location.pathname
  );


  document
    .getElementById(
      "eventPage"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "home"
    )
    .classList.remove(
      "hidden"
    );


  loadEvents();

}


/* =====================================================
   UTILITAIRES
===================================================== */

function formatDate(
  date
) {

  if (!date)
    return "";

  const parts =
    date.split("-");

  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   DEMARRAGE
===================================================== */

async function start() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get(
      "event"
    );


  if (code) {

    await openEvent(
      code
    );

  } else {

    await loadEvents();

  }

}


start();

</script>

</body>
</html>
